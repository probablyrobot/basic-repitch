[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "basic-repitch"
version = "0.4.0"
description = "Basic RePitch, a lightweight yet powerful audio-to-MIDI converter with pitch bend detection."
authors = [
	"Spotify <basic-pitch@spotify.com>",
	"Igor Bogicevic <igor.bogicevic@gmail.com>"
]
maintainers = [
	"Igor Bogicevic <igor.bogicevic@gmail.com>"
]
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/probablyrobot/basic-repitch"
packages = [
	{ include = "basic_pitch" }
]
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Natural Language :: English",
	"Operating System :: POSIX :: Linux",
	"Operating System :: MacOS :: MacOS X",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: Implementation :: CPython",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
librosa = "^0.10.1"
mir_eval = "^0.7"
numpy = "^1.26.4"
pretty_midi = "^0.2.10"
resampy = "^0.4.2"
scikit-learn = "^1.4.1.post1"
scipy = "^1.12.0"
typing_extensions = "^4.10.0"
setuptools = "^69.2.0"
tensorflow = { version = "^2.15.0", optional = true }

[[tool.poetry.source]]
name = "coral"
url = "https://google-coral.github.io/py-repo/"
priority = "supplemental"

[tool.poetry.group.data.dependencies]
apache_beam = "*"
mirdata = "^0.3.9"
smart_open = "*"
sox = "*"
ffmpeg-python = "*"

[tool.poetry.group.test.dependencies]
coverage = "^7.4.3"
pytest = "^8.1.1"
pytest-mock = "^3.12.0"
wave = "*"
mido = "^1.3.2"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.3"
mkdocs-material = "^9.5.13"
mkdocstrings = { extras = ["python"], version = "^0.24.1" }

[tool.poetry.group.dev.dependencies]
black = "^24.2.0"
flake8 = "^7.0.0"
isort = "^5.13.2"
mypy = "^1.9.0"
pre-commit = "^3.6.2"
pytest = "^8.1.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-xdist = "^3.5.0"
types-setuptools = "^69.1.0.20240310"
ruff = "^0.3.4"

[tool.poetry.extras]
tensorflow = ["tensorflow"]

[tool.poetry.scripts]
basic-repitch = "basic_pitch.predict:main"
bp-download = "basic_pitch.data.download:main"

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/docs/
'''

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warnings
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "PL", # pylint
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by black)
    "E203",  # whitespace before ':' (handled by black)
    "PLR0913",  # too many arguments (common in ML code)
    "PLR0912",  # too many branches (common in ML code)
    "PLR0915",  # too many statements (common in ML code)
    "PLR2004",  # magic numbers (common in ML for dimensions/shapes)
    "N803",  # argument name should be lowercase (common in ML libraries)
    "N806",  # variable name should be lowercase (common in ML libraries)
]

[tool.ruff.lint.isort]
known-first-party = ["basic_pitch"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B904"]  # Allow assert statements and bare raises in tests
"docs/*" = ["E402"]  # Allow imports not at top of file in docs
"basic_pitch/__init__.py" = ["F401"]  # Allow unused imports in __init__.py for API exposure
"basic_pitch/layers/nnaudio.py" = ["B028"]  # Allow no stacklevel in warnings for nnaudio
