[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "jams"
version = "0.3.4"
description = "JAMS: JSON Annotated Music Specification for Reproducible MIR Research"
authors = ["JAMS Development Team"]
license = "ISC"
readme = "README.md"
packages = [
    { include = "jams" }
]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
importlib = "*"
